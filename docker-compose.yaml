services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pgm
      POSTGRES_PASSWORD: pgm
      POSTGRES_DB: pgm_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgm -d pgm_test"]
      interval: 2s
      timeout: 3s
      retries: 15
